name: Validate Plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NPR_GOOGLE_VERTEX_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate plugins
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.NPR_GOOGLE_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ secrets.NPR_GOOGLE_VERTEX_REGION }}
        run: .github/scripts/validate-plugins.sh
